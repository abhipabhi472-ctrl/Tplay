<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>For Priya ❤️</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg1: #140611;
      --bg2: #2c0b24;
      --card: rgba(39, 11, 32, 0.86);
      --border: rgba(255, 130, 180, 0.28);
      --pink: #ff4d8d;
      --soft: #ff9ec4;
      --text: #fff6fa;
      --sub: #f0bed3;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      background: radial-gradient(circle at 50% 0%, var(--bg2), var(--bg1) 75%);
      color: var(--text);
      font-family: "Plus Jakarta Sans", system-ui, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px;
      overflow-x: hidden;
    }
    .hearts-bg { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 0; }
    .floating-heart {
      position: absolute; bottom: -30px; color: rgba(255, 77, 141, 0.26);
      animation: rise linear infinite; user-select: none;
    }
    @keyframes rise {
      0% { transform: translateY(0) scale(0.85); opacity: 0; }
      20% { opacity: 0.78; }
      100% { transform: translateY(-108vh) scale(1.2) rotate(20deg); opacity: 0; }
    }
    .phone-card {
      position: relative; z-index: 1; width: 100%; max-width: 420px;
      background: var(--card); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border); border-radius: 28px; padding: 26px 20px;
      box-shadow: 0 24px 65px rgba(0, 0, 0, 0.65); text-align: center;
    }
    .step-pill {
      display: inline-block; font-size: 11px; font-weight: 700; letter-spacing: 1px;
      text-transform: uppercase; color: var(--soft); background: rgba(255, 77, 141, 0.16);
      border: 1px solid rgba(255, 158, 196, 0.35); padding: 5px 12px; border-radius: 999px; margin-bottom: 12px;
    }
    .progress-track { width: 100%; height: 5px; background: rgba(255, 255, 255, 0.12); border-radius: 999px; overflow: hidden; margin-bottom: 20px; }
    .progress-bar { height: 100%; width: 20%; background: linear-gradient(90deg, var(--pink), var(--soft)); transition: width 0.35s ease; }
    .script-title { font-family: "Pacifico", cursive; font-size: 26px; font-weight: 400; color: #fff; text-shadow: 0 0 18px rgba(255, 77, 141, 0.45); margin-bottom: 10px; line-height: 1.3; }
    .sub-prompt { font-size: 15px; color: var(--sub); line-height: 1.5; margin-bottom: 20px; }
    .arena { position: relative; min-height: 130px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; }
    .btn-yes {
      padding: 13px 26px; border: none; border-radius: 16px;
      background: linear-gradient(135deg, var(--pink), #dc266d); color: #fff;
      font-size: 15px; font-weight: 700; cursor: pointer; box-shadow: 0 10px 25px rgba(255, 77, 141, 0.38); z-index: 2;
    }
    .btn-dodge {
      padding: 12px 22px; border-radius: 16px; border: 1px solid rgba(255, 255, 255, 0.24);
      background: rgba(255, 255, 255, 0.1); color: #ffe3ee; font-size: 14px; font-weight: 600;
      cursor: pointer; transition: transform 0.24s cubic-bezier(0.34, 1.56, 0.64, 1); z-index: 3;
    }
    .choice-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 14px; text-align: left; }
    .choice-btn {
      background: rgba(255, 255, 255, 0.07); border: 1px solid rgba(255, 158, 196, 0.25);
      border-radius: 16px; padding: 12px; color: var(--text); cursor: pointer;
    }
    .choice-btn.selected { background: rgba(255, 77, 141, 0.24); border-color: var(--pink); }
    .choice-title { font-size: 13.5px; font-weight: 700; display: block; margin-bottom: 2px; }
    .choice-desc { font-size: 11px; color: var(--sub); display: block; }
    .time-row { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-bottom: 16px; }
    .time-chip {
      padding: 9px; border-radius: 12px; border: 1px solid rgba(255, 255, 255, 0.18);
      background: rgba(255, 255, 255, 0.06); color: var(--sub); font-size: 12.5px; font-weight: 600; cursor: pointer;
    }
    .time-chip.selected { background: rgba(255, 77, 141, 0.26); border-color: var(--soft); color: #fff; }
    .puppy-popup {
      margin-top: 14px; padding: 12px; border-radius: 16px;
      background: rgba(255, 158, 196, 0.13); border: 1px dashed rgba(255, 158, 196, 0.45); display: none;
    }
    .puppy-face { font-size: 36px; display: inline-block; animation: bob 0.65s infinite alternate; }
    @keyframes bob { from { transform: translateY(0) rotate(-5deg); } to { transform: translateY(-3px) rotate(5deg); } }
    .puppy-msg { font-size: 13px; color: var(--sub); margin-top: 4px; line-height: 1.4; }
    .bgm-note { margin-top: 14px; font-size: 12px; color: var(--soft); opacity: 0.95; cursor: pointer; }
    .pass-card {
      background: rgba(255, 255, 255, 0.07); border: 1px solid rgba(255, 158, 196, 0.35);
      border-radius: 20px; padding: 14px 16px; text-align: left; margin: 14px 0;
    }
    .pass-top {
      display: flex; justify-content: space-between; font-size: 11px; letter-spacing: 1px;
      text-transform: uppercase; color: var(--soft); border-bottom: 1px dashed rgba(255, 255, 255, 0.2);
      padding-bottom: 8px; margin-bottom: 10px;
    }
    .pass-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; font-size: 12.5px; }
    .pass-item span { display: block; font-size: 10px; text-transform: uppercase; color: var(--sub); }
    .photo-box {
      width: 100%; max-height: 330px; border-radius: 20px; overflow: hidden;
      border: 2px solid rgba(255, 158, 196, 0.45); margin: 14px 0; background: rgba(0, 0, 0, 0.25);
    }
    .photo-box img { width: 100%; max-height: 330px; object-fit: cover; display: block; }
    .final-quote { font-size: 14.5px; line-height: 1.65; color: var(--text); font-style: italic; margin-top: 10px; }
    .audio-btn {
      margin-top: 16px; padding: 10px 18px; border-radius: 999px; border: none;
      background: linear-gradient(135deg, var(--pink), #dc266d); color: #fff; font-size: 13px; font-weight: 600; cursor: pointer;
    }
    .confetti-piece { position: fixed; top: -12px; width: 9px; height: 9px; z-index: 6; pointer-events: none; animation: fall linear forwards; }
    @keyframes fall { to { transform: translateY(106vh) rotate(700deg); opacity: 0; } }
  </style>
</head>
<body>
  <div class="hearts-bg" id="heartsBg"></div>
  <audio id="revealSong" src="https://raw.githubusercontent.com/abhipabhi472-ctrl/Tplay/main/animal-ney-veyrey-songcouplestelugu-efx-whatsapp-statuslove-song-statussrkedits297207511.mp3" loop preload="auto"></audio>

  <div class="phone-card" id="appCard">
    <div class="step-pill">Step 1 of 5 • For Priya</div>
    <div class="progress-track"><div class="progress-bar" style="width:20%"></div></div>
    <h1 class="script-title">Hey Priya</h1>
    <p class="sub-prompt">Since I already know how I feel... will you take the lead and propose to me?</p>
    <div class="arena">
      <button class="btn-yes" onclick="goStep(1)">Yes, choose me ❤️</button>
      <button class="btn-dodge" onclick="dodge(this)">Maybe later 😜</button>
    </div>
    <div class="puppy-popup" id="puppyPopup">
      <div class="puppy-face">🐶😢💧</div>
      <div class="puppy-msg">A little puppy is crying because you dodged! Tap "Yes, choose me ❤️" to make it smile.</div>
    </div>
    <div class="bgm-note" id="bgmBtn" onclick="toggleBgm()">🎵 Tap anywhere to start love BGM</div>
  </div>

  <script>
    const PRIYA_PHOTO_URL = "https://i.postimg.cc/JhzGFHgf/IMG-20261119-210055.jpg";
    const state = { step: 0, when: "Tomorrow", time: "Evening", where: "Chat & Call", bring: "A sweet note", then: "More talking" };
    const dodgeLabels = ["Maybe later 😜", "Are you sure?", "Really?", "Puppy is crying!", "Tap the pink one!"];
    let dodgeCount = 0;

    // Audible Warm Romantic Piano Melody BGM
    let audioCtx = null, masterGain = null, bgmTimer = null, bgmActive = false, noteStep = 0;
    const melodyNotes = [
      523.25, 659.25, 783.99, 659.25, // C5 E5 G5 E5
      440.00, 523.25, 659.25, 523.25, // A4 C5 E5 C5
      349.23, 440.00, 523.25, 659.25, // F4 A4 C5 E5
      392.00, 493.88, 587.33, 493.88  // G4 B4 D5 B4
    ];

    function playPianoNote(freq) {
      if (!audioCtx || !masterGain || !bgmActive) return;
      const now = audioCtx.currentTime;
      const osc1 = audioCtx.createOscillator();
      const osc2 = audioCtx.createOscillator();
      const noteGain = audioCtx.createGain();

      osc1.type = "triangle";
      osc1.frequency.setValueAtTime(freq, now);
      osc2.type = "sine";
      osc2.frequency.setValueAtTime(freq * 0.5, now); // Warm lower octave

      noteGain.gain.setValueAtTime(0.0001, now);
      noteGain.gain.linearRampToValueAtTime(0.16, now + 0.06);
      noteGain.gain.exponentialRampToValueAtTime(0.0001, now + 1.15);

      osc1.connect(noteGain);
      osc2.connect(noteGain);
      noteGain.connect(masterGain);

      osc1.start(now);
      osc2.start(now);
      osc1.stop(now + 1.2);
      osc2.stop(now + 1.2);
    }

    function startLowLoveBgm() {
      if (bgmActive) return;
      const Ctx = window.AudioContext || window.webkitAudioContext;
      if (!Ctx) return;
      if (!audioCtx) {
        audioCtx = new Ctx();
        masterGain = audioCtx.createGain();
        masterGain.gain.setValueAtTime(0.35, audioCtx.currentTime);
        masterGain.connect(audioCtx.destination);
      }
      if (audioCtx.state === "suspended") audioCtx.resume();
      bgmActive = true;
      const el = document.getElementById("bgmBtn");
      if (el) el.textContent = "🎵 Love BGM playing • Tap to mute";

      playPianoNote(melodyNotes[noteStep]);
      noteStep = (noteStep + 1) % melodyNotes.length;
      bgmTimer = setInterval(() => {
        playPianoNote(melodyNotes[noteStep]);
        noteStep = (noteStep + 1) % melodyNotes.length;
      }, 620);
    }

    function stopLowLoveBgm() {
      bgmActive = false;
      if (bgmTimer) { clearInterval(bgmTimer); bgmTimer = null; }
      if (audioCtx && masterGain) masterGain.gain.setTargetAtTime(0.0001, audioCtx.currentTime, 0.08);
    }

    function toggleBgm() {
      const el = document.getElementById("bgmBtn");
      if (bgmActive) {
        stopLowLoveBgm();
        if (el) el.textContent = "🔇 Love BGM muted • Tap to play";
      } else {
        if (audioCtx && masterGain) masterGain.gain.setValueAtTime(0.35, audioCtx.currentTime);
        startLowLoveBgm();
      }
    }

    function dodge(btn) {
      startLowLoveBgm();
      const dx = Math.floor(Math.random() * 130) - 65, dy = Math.floor(Math.random() * 64) - 32;
      btn.style.transform = `translate(${dx}px, ${dy}px)`;
      dodgeCount++;
      btn.textContent = dodgeLabels[Math.min(dodgeCount, dodgeLabels.length - 1)];
      const pop = document.getElementById("puppyPopup");
      if (pop) pop.style.display = "block";
    }

    function goStep(n) {
      startLowLoveBgm();
      dodgeCount = 0;
      state.step = n;
      renderStep();
    }

    function setChoice(key, val) {
      startLowLoveBgm();
      state[key] = val;
      renderStep();
    }

    function finishReveal() {
      state.step = 5;
      renderStep();
      const colors = ["#ff4d8d", "#ff9ec4", "#ffd166", "#ffffff", "#d8b4fe"];
      for (let i = 0; i < 40; i++) {
        const dot = document.createElement("div");
        dot.className = "confetti-piece";
        dot.style.left = Math.random() * 100 + "vw";
        dot.style.background = colors[Math.floor(Math.random() * colors.length)];
        dot.style.animationDuration = (2.4 + Math.random() * 2.4) + "s";
        document.body.appendChild(dot);
        setTimeout(() => dot.remove(), 5000);
      }
      stopLowLoveBgm();
      const song = document.getElementById("revealSong");
      song.currentTime = 0;
      song.play().catch(() => {
        const b = document.getElementById("songToggleBtn");
        if (b) b.textContent = "🔊 Tap to Play Song";
      });
    }

    function toggleRevealSong(btn) {
      const song = document.getElementById("revealSong");
      if (song.paused) { song.play(); btn.textContent = "🔊 Song Playing • Tap to Pause"; }
      else { song.pause(); btn.textContent = "🔇 Song Paused • Tap to Play"; }
    }

    function renderStep() {
      const card = document.getElementById("appCard");
      const pct = ((state.step + 1) / 5) * 100;
      const bgmLabel = bgmActive ? "🎵 Love BGM playing • Tap to mute" : "🔇 Love BGM muted • Tap to play";

      if (state.step === 1) {
        card.innerHTML = `
          <div class="step-pill">Step 2 of 5 • Date Invite</div>
          <div class="progress-track"><div class="progress-bar" style="width:${pct}%"></div></div>
          <h1 class="script-title">Will you go out with me, Priya?</h1>
          <p class="sub-prompt">No pressure... just a sweet little plan made for you.</p>
          <div class="arena">
            <button class="btn-yes" onclick="goStep(2)">Yes! 💖</button>
            <button class="btn-dodge" onclick="dodge(this)">No</button>
          </div>
          <div class="puppy-popup" id="puppyPopup">
            <div class="puppy-face">🐶😢💧</div>
            <div class="puppy-msg">Puppy is sad you said no! Tap "Yes! 💖" to cheer it up.</div>
          </div>
          <div class="bgm-note" id="bgmBtn" onclick="toggleBgm()">${bgmLabel}</div>
        `;
      } else if (state.step === 2) {
        const days = ["Today", "Tomorrow", "This Weekend", "Whenever you're free"];
        const times = ["Morning", "Afternoon", "Evening", "Late Night"];
        card.innerHTML = `
          <div class="step-pill">Step 3 of 5 • When</div>
          <div class="progress-track"><div class="progress-bar" style="width:${pct}%"></div></div>
          <h1 class="script-title">When are you free?</h1>
          <p class="sub-prompt">Pick a day and time that feels right for you.</p>
          <div class="choice-grid">
            ${days.map(d => `<button class="choice-btn ${state.when === d ? "selected" : ""}" onclick="setChoice('when','${d}')"><span class="choice-title">${d}</span><span class="choice-desc">Easy & cozy</span></button>`).join("")}
          </div>
          <div class="time-row">
            ${times.map(t => `<button class="time-chip ${state.time === t ? "selected" : ""}" onclick="setChoice('time','${t}')">${t}</button>`).join("")}
          </div>
          <button class="btn-yes" style="width:100%" onclick="goStep(3)">Continue →</button>
          <div class="bgm-note" id="bgmBtn" onclick="toggleBgm()">${bgmLabel}</div>
        `;
      } else if (state.step === 3) {
        const places = [
          { title: "Chat & Call", desc: "Long talks & laughs" },
          { title: "Coffee Spot", desc: "Warm cups & stories" },
          { title: "Quiet Walk", desc: "Slow evening stroll" },
          { title: "Movie & Snacks", desc: "Easy & relaxed" }
        ];
        const brings = [
          { title: "A sweet note", desc: "Straight from the heart" },
          { title: "Your fav song", desc: "Queueing it up" },
          { title: "Something sweet", desc: "Little treat" },
          { title: "Just my time", desc: "All yours" }
        ];
        card.innerHTML = `
          <div class="step-pill">Step 4 of 5 • Vibe & Details</div>
          <div class="progress-track"><div class="progress-bar" style="width:${pct}%"></div></div>
          <h1 class="script-title">Where & what to bring?</h1>
          <p class="sub-prompt">Choose your vibe and little extra.</p>
          <div class="choice-grid">
            ${places.map(p => `<button class="choice-btn ${state.where === p.title ? "selected" : ""}" onclick="setChoice('where','${p.title}')"><span class="choice-title">${p.title}</span><span class="choice-desc">${p.desc}</span></button>`).join("")}
          </div>
          <div class="choice-grid">
            ${brings.map(b => `<button class="choice-btn ${state.bring === b.title ? "selected" : ""}" onclick="setChoice('bring','${b.title}')"><span class="choice-title">${b.title}</span><span class="choice-desc">${b.desc}</span></button>`).join("")}
          </div>
          <button class="btn-yes" style="width:100%" onclick="goStep(4)">Continue →</button>
          <div class="bgm-note" id="bgmBtn" onclick="toggleBgm()">${bgmLabel}</div>
        `;
      } else if (state.step === 4) {
        const thens = [
          { title: "More talking", desc: "Never running out of words" },
          { title: "Dessert & treat", desc: "Sweet ending" },
          { title: "Stargazing", desc: "Calm & peaceful" },
          { title: "Plan next time", desc: "Looking ahead" }
        ];
        card.innerHTML = `
          <div class="step-pill">Step 5 of 5 • And Then?</div>
          <div class="progress-track"><div class="progress-bar" style="width:${pct}%"></div></div>
          <h1 class="script-title">And then?</h1>
          <p class="sub-prompt">How do we wrap up our time together?</p>
          <div class="choice-grid">
            ${thens.map(x => `<button class="choice-btn ${state.then === x.title ? "selected" : ""}" onclick="setChoice('then','${x.title}')"><span class="choice-title">${x.title}</span><span class="choice-desc">${x.desc}</span></button>`).join("")}
          </div>
          <button class="btn-yes" style="width:100%" onclick="finishReveal()">See Your Surprise ✨</button>
          <div class="bgm-note" id="bgmBtn" onclick="toggleBgm()">${bgmLabel}</div>
        `;
      } else if (state.step === 5) {
        card.innerHTML = `
          <div class="step-pill">It's a Date • For Priya</div>
          <h1 class="script-title">For You, Priya</h1>
          <div class="pass-card">
            <div class="pass-top"><span>Date Pass</span><span>Admit Two</span></div>
            <div class="pass-grid">
              <div class="pass-item"><span>When</span><strong>${state.when}</strong></div>
              <div class="pass-item"><span>Time</span><strong>${state.time}</strong></div>
              <div class="pass-item"><span>Where</span><strong>${state.where}</strong></div>
              <div class="pass-item"><span>Bring & Then</span><strong>${state.bring} • ${state.then}</strong></div>
            </div>
          </div>
          <div class="photo-box"><img src="${PRIYA_PHOTO_URL}" alt="Priya" /></div>
          <p class="final-quote">“We have never hugged or kissed, and yet watching from afar, chatting, and talking to you is my favorite part of every day.”</p>
          <button class="audio-btn" id="songToggleBtn" onclick="toggleRevealSong(this)">🔊 Song Playing • Tap to Pause</button>
        `;
      }
    }

    ["pointerdown", "touchstart", "click"].forEach(evt => {
      document.addEventListener(evt, () => {
        if (state.step < 5 && !bgmActive) startLowLoveBgm();
      }, { once: true });
    });

    const heartsBg = document.getElementById("heartsBg");
    for (let i = 0; i < 14; i++) {
      const h = document.createElement("div");
      h.className = "floating-heart"; h.textContent = "❤";
      h.style.left = Math.random() * 100 + "%"; h.style.fontSize = (14 + Math.random() * 16) + "px";
      h.style.animationDuration = (6 + Math.random() * 6) + "s";
      heartsBg.appendChild(h);
    }
  </script>
</body>
</html>
