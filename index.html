<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>For Priya ❤️</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg1: #12040e;
      --bg2: #2d0923;
      --card: rgba(36, 9, 29, 0.86);
      --border: rgba(255, 140, 190, 0.3);
      --pink: #ff4d8d;
      --soft: #ffa3c7;
      --gold: #ffd6a5;
      --text: #fff7fb;
      --sub: #f4c4d8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      background: radial-gradient(circle at 50% 0%, var(--bg2), var(--bg1) 76%);
      color: var(--text);
      font-family: "Plus Jakarta Sans", system-ui, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px;
      overflow-x: hidden;
    }
    .hearts-bg { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 0; }
    .floating-heart {
      position: absolute; bottom: -30px; color: rgba(255, 77, 141, 0.28);
      animation: rise linear infinite; user-select: none;
    }
    @keyframes rise {
      0% { transform: translateY(0) scale(0.85); opacity: 0; }
      20% { opacity: 0.8; }
      100% { transform: translateY(-108vh) scale(1.25) rotate(22deg); opacity: 0; }
    }
    .phone-card {
      position: relative; z-index: 1; width: 100%; max-width: 420px;
      background: var(--card); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
      border: 1px solid var(--border); border-radius: 30px; padding: 28px 20px;
      box-shadow: 0 26px 70px rgba(0, 0, 0, 0.68), 0 0 40px rgba(255, 77, 141, 0.16);
      text-align: center;
      animation: cardFade 0.45s ease;
    }
    @keyframes cardFade {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .step-pill {
      display: inline-block; font-size: 11px; font-weight: 700; letter-spacing: 1.1px;
      text-transform: uppercase; color: var(--soft); background: rgba(255, 77, 141, 0.16);
      border: 1px solid rgba(255, 158, 196, 0.35); padding: 5px 14px; border-radius: 999px; margin-bottom: 14px;
    }
    .progress-track { width: 100%; height: 5px; background: rgba(255, 255, 255, 0.12); border-radius: 999px; overflow: hidden; margin-bottom: 22px; }
    .progress-bar { height: 100%; width: 20%; background: linear-gradient(90deg, var(--pink), var(--soft), var(--gold)); transition: width 0.4s ease; }
    .script-title {
      font-family: "Pacifico", cursive; font-size: 27px; font-weight: 400; color: #fff;
      text-shadow: 0 0 20px rgba(255, 77, 141, 0.5); margin-bottom: 10px; line-height: 1.32;
    }
    .sub-prompt { font-size: 14.5px; color: var(--sub); line-height: 1.55; margin-bottom: 22px; }
    .arena { position: relative; min-height: 132px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; }
    .btn-yes {
      padding: 14px 28px; border: none; border-radius: 18px;
      background: linear-gradient(135deg, var(--pink), #d81b60); color: #fff;
      font-size: 15px; font-weight: 700; cursor: pointer;
      box-shadow: 0 10px 26px rgba(255, 77, 141, 0.42); z-index: 2;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .btn-yes:active { transform: scale(0.97); }
    .btn-dodge {
      padding: 12px 22px; border-radius: 16px; border: 1px solid rgba(255, 255, 255, 0.24);
      background: rgba(255, 255, 255, 0.1); color: #ffe3ee; font-size: 14px; font-weight: 600;
      cursor: pointer; transition: transform 0.24s cubic-bezier(0.34, 1.56, 0.64, 1); z-index: 3;
    }

    /* Lovely Styled Choice Cards (Steps 3 to 5) */
    .lovely-list { display: flex; flex-direction: column; gap: 11px; margin-bottom: 18px; text-align: left; }
    .lovely-card {
      display: flex; align-items: center; gap: 14px;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.08), rgba(255, 77, 141, 0.06));
      border: 1px solid rgba(255, 163, 199, 0.25);
      border-radius: 18px; padding: 14px 16px; color: var(--text); cursor: pointer;
      transition: all 0.22s ease;
    }
    .lovely-card:hover, .lovely-card.selected {
      background: linear-gradient(135deg, rgba(255, 77, 141, 0.28), rgba(216, 27, 96, 0.18));
      border-color: var(--soft);
      box-shadow: 0 8px 22px rgba(255, 77, 141, 0.24);
      transform: translateY(-2px);
    }
    .lovely-icon {
      font-size: 24px; width: 42px; height: 42px; border-radius: 14px;
      background: rgba(255, 77, 141, 0.18); display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .lovely-info { flex: 1; }
    .lovely-title { font-size: 14.5px; font-weight: 700; display: block; margin-bottom: 2px; color: #fff; }
    .lovely-desc { font-size: 12px; color: var(--sub); display: block; line-height: 1.35; }
    .lovely-check { font-size: 16px; color: var(--soft); opacity: 0.45; }
    .lovely-card.selected .lovely-check { opacity: 1; color: #fff; }

    .puppy-popup {
      margin-top: 14px; padding: 12px; border-radius: 16px;
      background: rgba(255, 158, 196, 0.13); border: 1px dashed rgba(255, 158, 196, 0.45); display: none;
    }
    .puppy-face { font-size: 36px; display: inline-block; animation: bob 0.65s infinite alternate; }
    @keyframes bob { from { transform: translateY(0) rotate(-5deg); } to { transform: translateY(-3px) rotate(5deg); } }
    .puppy-msg { font-size: 13px; color: var(--sub); margin-top: 4px; line-height: 1.4; }

    /* Final Reveal Screen */
    .pass-card {
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.09), rgba(255, 77, 141, 0.09));
      border: 1px solid rgba(255, 163, 199, 0.38);
      border-radius: 22px; padding: 15px 16px; text-align: left; margin: 14px 0;
    }
    .pass-top {
      display: flex; justify-content: space-between; font-size: 11px; letter-spacing: 1.2px;
      text-transform: uppercase; color: var(--gold); border-bottom: 1px dashed rgba(255, 255, 255, 0.22);
      padding-bottom: 8px; margin-bottom: 10px; font-weight: 700;
    }
    .pass-row { margin-bottom: 8px; font-size: 13px; }
    .pass-row:last-child { margin-bottom: 0; }
    .pass-row span { display: block; font-size: 10.5px; text-transform: uppercase; color: var(--soft); letter-spacing: 0.6px; }
    .photo-box {
      width: 100%; max-height: 340px; border-radius: 22px; overflow: hidden;
      border: 2px solid rgba(255, 163, 199, 0.5); box-shadow: 0 16px 36px rgba(0, 0, 0, 0.55);
      margin: 14px 0; background: rgba(0, 0, 0, 0.25);
    }
    .photo-box img { width: 100%; max-height: 340px; object-fit: cover; display: block; }
    .final-quote {
      font-size: 15px; line-height: 1.7; color: var(--text); font-style: italic;
      margin-top: 12px; padding: 0 4px;
    }
    .confetti-piece { position: fixed; top: -12px; width: 9px; height: 9px; z-index: 6; pointer-events: none; animation: fall linear forwards; }
    @keyframes fall { to { transform: translateY(106vh) rotate(700deg); opacity: 0; } }
  </style>
</head>
<body>
  <div class="hearts-bg" id="heartsBg"></div>

  <!-- Starting Telugu Movie Love BGM (Upload your Telugu love BGM as bgm.mp3 in the same folder) -->
  <audio id="startBgm" src="bgm.mp3" loop preload="auto"></audio>

  <!-- Final Reveal Song -->
  <audio id="revealSong" src="https://raw.githubusercontent.com/abhipabhi472-ctrl/Tplay/main/animal-ney-veyrey-songcouplestelugu-efx-whatsapp-statuslove-song-statussrkedits297207511.mp3" loop preload="auto"></audio>

  <div class="phone-card" id="appCard">
    <div class="step-pill">Chapter 1 of 5 • For Priya</div>
    <div class="progress-track"><div class="progress-bar" style="width:20%"></div></div>
    <h1 class="script-title">Hey Priya</h1>
    <p class="sub-prompt">Since I already know how I feel... will you take the lead and propose to me?</p>
    <div class="arena">
      <button class="btn-yes" onclick="goStep(1)">Yes, choose me ❤️</button>
      <button class="btn-dodge" onclick="dodge(this)">Maybe later 😜</button>
    </div>
    <div class="puppy-popup" id="puppyPopup">
      <div class="puppy-face">🐶😢💧</div>
      <div class="puppy-msg">A little puppy is crying because you dodged! Tap "Yes, choose me ❤️" to make it smile.</div>
    </div>
  </div>

  <script>
    const PRIYA_PHOTO_URL = "https://i.postimg.cc/JhzGFHgf/IMG-20261119-210055.jpg";
    const state = {
      step: 0,
      moment: "Late-night chats that never feel long enough",
      vibe: "Stealing glances from afar & smiling quietly",
      promise: "Always being your calm & safe place"
    };
    const dodgeLabels = ["Maybe later 😜", "Are you sure?", "Really?", "Puppy is crying!", "Tap the pink one!"];
    let dodgeCount = 0;
    let bgmStarted = false;

    const startBgm = document.getElementById("startBgm");
    const revealSong = document.getElementById("revealSong");

    function playStartBgm() {
      if (bgmStarted || state.step >= 5) return;
      startBgm.volume = 0.28; // Low & soothing Telugu movie love BGM
      startBgm.play().then(() => {
        bgmStarted = true;
      }).catch(() => {});
    }

    function dodge(btn) {
      playStartBgm();
      const dx = Math.floor(Math.random() * 130) - 65;
      const dy = Math.floor(Math.random() * 64) - 32;
      btn.style.transform = `translate(${dx}px, ${dy}px)`;
      dodgeCount++;
      btn.textContent = dodgeLabels[Math.min(dodgeCount, dodgeLabels.length - 1)];
      const pop = document.getElementById("puppyPopup");
      if (pop) pop.style.display = "block";
    }

    function goStep(n) {
      playStartBgm();
      dodgeCount = 0;
      state.step = n;
      renderStep();
    }

    function setChoice(key, val) {
      playStartBgm();
      state[key] = val;
      renderStep();
    }

    function finishReveal() {
      state.step = 5;
      renderStep();

      const colors = ["#ff4d8d", "#ffa3c7", "#ffd6a5", "#ffffff", "#e0aaff"];
      for (let i = 0; i < 45; i++) {
        const dot = document.createElement("div");
        dot.className = "confetti-piece";
        dot.style.left = Math.random() * 100 + "vw";
        dot.style.background = colors[Math.floor(Math.random() * colors.length)];
        dot.style.animationDuration = (2.4 + Math.random() * 2.4) + "s";
        document.body.appendChild(dot);
        setTimeout(() => dot.remove(), 5000);
      }

      startBgm.pause();
      startBgm.currentTime = 0;
      revealSong.currentTime = 0;
      revealSong.volume = 1.0;
      revealSong.play().catch(() => {});
    }

    function renderStep() {
      const card = document.getElementById("appCard");
      const pct = ((state.step + 1) / 5) * 100;

      if (state.step === 1) {
        card.innerHTML = `
          <div class="step-pill">Chapter 2 of 5 • Our Date</div>
          <div class="progress-track"><div class="progress-bar" style="width:${pct}%"></div></div>
          <h1 class="script-title">Will you go out with me, Priya?</h1>
          <p class="sub-prompt">No rush, no pressure—just a quiet little moment meant only for us.</p>
          <div class="arena">
            <button class="btn-yes" onclick="goStep(2)">Yes, I'd love to 💖</button>
            <button class="btn-dodge" onclick="dodge(this)">No</button>
          </div>
          <div class="puppy-popup" id="puppyPopup">
            <div class="puppy-face">🐶😢💧</div>
            <div class="puppy-msg">Puppy is heartbroken! Tap "Yes, I'd love to 💖" to make it happy.</div>
          </div>
        `;
      } else if (state.step === 2) {
        const options = [
          { icon: "🌙", title: "Late-night chats that never feel long enough", desc: "Losing track of time just talking to you" },
          { icon: "✨", title: "Seeing your notification pop up", desc: "Instant smile on a busy day" },
          { icon: "👀", title: "Catching a glimpse of you from afar", desc: "The quietest yet best part of my day" }
        ];
        card.innerHTML = `
          <div class="step-pill">Chapter 3 of 5 • Little Moments</div>
          <div class="progress-track"><div class="progress-bar" style="width:${pct}%"></div></div>
          <h1 class="script-title">What makes us feel so special?</h1>
          <p class="sub-prompt">Pick the moment that feels most like you and me.</p>
          <div class="lovely-list">
            ${options.map(o => `
              <div class="lovely-card ${state.moment === o.title ? "selected" : ""}" onclick="setChoice('moment', '${o.title.replace(/'/g, "\\'")}')">
                <div class="lovely-icon">${o.icon}</div>
                <div class="lovely-info">
                  <span class="lovely-title">${o.title}</span>
                  <span class="lovely-desc">${o.desc}</span>
                </div>
                <div class="lovely-check">♥</div>
              </div>
            `).join("")}
          </div>
          <button class="btn-yes" style="width:100%" onclick="goStep(3)">Next Chapter →</button>
        `;
      } else if (state.step === 3) {
        const options = [
          { icon: "💫", title: "Stealing glances from afar & smiling quietly", desc: "Saying everything without a single word" },
          { icon: "💬", title: "Endless conversations & effortless comfort", desc: "Where every reply feels warm" },
          { icon: "🎶", title: "Sharing songs that remind us of each other", desc: "Every lyric feeling a little closer" }
        ];
        card.innerHTML = `
          <div class="step-pill">Chapter 4 of 5 • Our Vibe</div>
          <div class="progress-track"><div class="progress-bar" style="width:${pct}%"></div></div>
          <h1 class="script-title">How do you like our story most?</h1>
          <p class="sub-prompt">Even from a distance, some connections feel effortless.</p>
          <div class="lovely-list">
            ${options.map(o => `
              <div class="lovely-card ${state.vibe === o.title ? "selected" : ""}" onclick="setChoice('vibe', '${o.title.replace(/'/g, "\\'")}')">
                <div class="lovely-icon">${o.icon}</div>
                <div class="lovely-info">
                  <span class="lovely-title">${o.title}</span>
                  <span class="lovely-desc">${o.desc}</span>
                </div>
                <div class="lovely-check">♥</div>
              </div>
            `).join("")}
          </div>
          <button class="btn-yes" style="width:100%" onclick="goStep(4)">One Last Thing →</button>
        `;
      } else if (state.step === 4) {
        const options = [
          { icon: "🤍", title: "Always being your calm & safe place", desc: "No matter how far or busy life gets" },
          { icon: "🌷", title: "Waiting patiently for our first real hangout", desc: "Whenever you feel completely ready" },
          { icon: "🌟", title: "Keeping this pure bond growing every day", desc: "One sweet conversation at a time" }
        ];
        card.innerHTML = `
          <div class="step-pill">Chapter 5 of 5 • My Promise</div>
          <div class="progress-track"><div class="progress-bar" style="width:${pct}%"></div></div>
          <h1 class="script-title">What should I keep for you?</h1>
          <p class="sub-prompt">Choose the promise you want me to hold onto.</p>
          <div class="lovely-list">
            ${options.map(o => `
              <div class="lovely-card ${state.promise === o.title ? "selected" : ""}" onclick="setChoice('promise', '${o.title.replace(/'/g, "\\'")}')">
                <div class="lovely-icon">${o.icon}</div>
                <div class="lovely-info">
                  <span class="lovely-title">${o.title}</span>
                  <span class="lovely-desc">${o.desc}</span>
                </div>
                <div class="lovely-check">♥</div>
              </div>
            `).join("")}
          </div>
          <button class="btn-yes" style="width:100%" onclick="finishReveal()">Open Your Surprise ✨</button>
        `;
      } else if (state.step === 5) {
        card.innerHTML = `
          <div class="step-pill">Always Yours • For Priya</div>
          <h1 class="script-title">For You, Priya</h1>
          <div class="pass-card">
            <div class="pass-top"><span>Our Little Story</span><span>Priya ❤️</span></div>
            <div class="pass-row"><span>Favorite Moment</span><strong>${state.moment}</strong></div>
            <div class="pass-row"><span>Our Vibe</span><strong>${state.vibe}</strong></div>
            <div class="pass-row"><span>My Promise</span><strong>${state.promise}</strong></div>
          </div>
          <div class="photo-box"><img src="${PRIYA_PHOTO_URL}" alt="Priya" /></div>
          <p class="final-quote">
            “We have never hugged or kissed, and yet watching from afar, chatting, and talking to you is my favorite part of every day.”
          </p>
        `;
      }
    }

    ["pointerdown", "touchstart", "click"].forEach(evt => {
      document.addEventListener(evt, playStartBgm, { once: true });
    });

    const heartsBg = document.getElementById("heartsBg");
    for (let i = 0; i < 15; i++) {
      const h = document.createElement("div");
      h.className = "floating-heart"; h.textContent = "❤";
      h.style.left = Math.random() * 100 + "%"; h.style.fontSize = (14 + Math.random() * 16) + "px";
      h.style.animationDuration = (6 + Math.random() * 6) + "s";
      heartsBg.appendChild(h);
    }
  </script>
</body>
</html>
