<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>For Priya ❤️</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-dark: #140611;
      --bg-plum: #2c0b24;
      --card-bg: rgba(39, 11, 32, 0.78);
      --card-border: rgba(255, 130, 180, 0.25);
      --pink: #ff4d8d;
      --pink-soft: #ff9ec4;
      --text-main: #fff6fa;
      --text-sub: #f0bed3;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: radial-gradient(circle at 50% 0%, var(--bg-plum), var(--bg-dark) 75%);
      color: var(--text-main);
      font-family: "Plus Jakarta Sans", system-ui, -apple-system, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px;
      overflow-x: hidden;
      position: relative;
    }

    .hearts-bg {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 0;
    }

    .floating-heart {
      position: absolute;
      bottom: -30px;
      color: rgba(255, 77, 141, 0.24);
      animation: riseHeart linear infinite;
      user-select: none;
    }

    @keyframes riseHeart {
      0% { transform: translateY(0) scale(0.85) rotate(0deg); opacity: 0; }
      15% { opacity: 0.75; }
      85% { opacity: 0.5; }
      100% { transform: translateY(-108vh) scale(1.2) rotate(22deg); opacity: 0; }
    }

    .phone-card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 420px;
      background: var(--card-bg);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid var(--card-border);
      border-radius: 28px;
      padding: 26px 20px;
      box-shadow: 0 24px 65px rgba(0, 0, 0, 0.65), 0 0 36px rgba(255, 77, 141, 0.14);
      text-align: center;
    }

    .step-pill {
      display: inline-block;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--pink-soft);
      background: rgba(255, 77, 141, 0.16);
      border: 1px solid rgba(255, 158, 196, 0.35);
      padding: 5px 12px;
      border-radius: 999px;
      margin-bottom: 12px;
    }

    .progress-track {
      width: 100%;
      height: 5px;
      background: rgba(255, 255, 255, 0.12);
      border-radius: 999px;
      overflow: hidden;
      margin-bottom: 20px;
    }

    .progress-bar {
      height: 100%;
      width: 20%;
      background: linear-gradient(90deg, var(--pink), var(--pink-soft));
      transition: width 0.35s ease;
    }

    .script-title {
      font-family: "Pacifico", cursive;
      font-size: 27px;
      font-weight: 400;
      color: #fff;
      text-shadow: 0 0 18px rgba(255, 77, 141, 0.45);
      margin-bottom: 10px;
      line-height: 1.3;
    }

    .sub-prompt {
      font-size: 15px;
      color: var(--text-sub);
      line-height: 1.5;
      margin-bottom: 20px;
    }

    .arena {
      position: relative;
      min-height: 135px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }

    .btn-yes {
      padding: 13px 26px;
      border: none;
      border-radius: 16px;
      background: linear-gradient(135deg, var(--pink), #dc266d);
      color: #fff;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 10px 25px rgba(255, 77, 141, 0.38);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      z-index: 2;
    }

    .btn-yes:hover {
      transform: translateY(-2px);
    }

    .btn-dodge {
      padding: 12px 22px;
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.24);
      background: rgba(255, 255, 255, 0.1);
      color: #ffe3ee;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.24s cubic-bezier(0.34, 1.56, 0.64, 1);
      z-index: 3;
      user-select: none;
    }

    .choice-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-bottom: 16px;
      text-align: left;
    }

    .choice-btn {
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 158, 196, 0.25);
      border-radius: 16px;
      padding: 13px 12px;
      color: var(--text-main);
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .choice-btn:hover,
    .choice-btn.selected {
      background: rgba(255, 77, 141, 0.22);
      border-color: var(--pink);
      transform: translateY(-1px);
    }

    .choice-title {
      font-size: 14px;
      font-weight: 700;
      display: block;
      margin-bottom: 2px;
    }

    .choice-desc {
      font-size: 11.5px;
      color: var(--text-sub);
      display: block;
    }

    .time-row {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      margin-bottom: 18px;
    }

    .time-chip {
      padding: 9px 10px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.18);
      background: rgba(255, 255, 255, 0.06);
      color: var(--text-sub);
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
    }

    .time-chip.selected {
      background: rgba(255, 77, 141, 0.26);
      border-color: var(--pink-soft);
      color: #fff;
    }

    .puppy-popup {
      margin-top: 14px;
      padding: 12px 14px;
      border-radius: 16px;
      background: rgba(255, 158, 196, 0.12);
      border: 1px dashed rgba(255, 158, 196, 0.45);
      display: none;
      animation: fadePop 0.28s ease;
    }

    @keyframes fadePop {
      from { opacity: 0; transform: scale(0.9); }
      to { opacity: 1; transform: scale(1); }
    }

    .puppy-face {
      font-size: 36px;
      display: inline-block;
      animation: cryBob 0.65s infinite alternate;
    }

    @keyframes cryBob {
      from { transform: translateY(0) rotate(-5deg); }
      to { transform: translateY(-3px) rotate(5deg); }
    }

    .puppy-msg {
      font-size: 13px;
      color: var(--text-sub);
      margin-top: 4px;
      line-height: 1.4;
    }

    .bgm-note {
      margin-top: 14px;
      font-size: 11.5px;
      color: var(--text-sub);
      opacity: 0.88;
      cursor: pointer;
    }

    .pass-card {
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 158, 196, 0.35);
      border-radius: 20px;
      padding: 14px 16px;
      text-align: left;
      margin: 14px 0;
    }

    .pass-top {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      color: var(--pink-soft);
      border-bottom: 1px dashed rgba(255, 255, 255, 0.2);
      padding-bottom: 8px;
      margin-bottom: 10px;
    }

    .pass-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      font-size: 12.5px;
    }

    .pass-item span {
      display: block;
      font-size: 10.5px;
      text-transform: uppercase;
      color: var(--text-sub);
    }

    .photo-box {
      width: 100%;
      max-height: 330px;
      border-radius: 20px;
      overflow: hidden;
      border: 2px solid rgba(255, 158, 196, 0.45);
      box-shadow: 0 14px 32px rgba(0, 0, 0, 0.55);
      margin: 14px 0;
      background: rgba(0, 0, 0, 0.25);
    }

    .photo-box img {
      width: 100%;
      max-height: 330px;
      object-fit: cover;
      display: block;
    }

    .final-quote {
      font-size: 14.5px;
      line-height: 1.65;
      color: var(--text-main);
      font-style: italic;
      margin-top: 10px;
    }

    .audio-btn {
      margin-top: 16px;
      padding: 10px 18px;
      border-radius: 999px;
      border: none;
      background: linear-gradient(135deg, var(--pink), #dc266d);
      color: #fff;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }

    .confetti-piece {
      position: fixed;
      top: -12px;
      width: 9px;
      height: 9px;
      z-index: 6;
      pointer-events: none;
      animation: fallConfetti linear forwards;
    }

    @keyframes fallConfetti {
      to { transform: translateY(106vh) rotate(700deg); opacity: 0; }
    }
  </style>
</head>
<body>
  <div class="hearts-bg" id="heartsBg"></div>

  <!-- Final Reveal Song from GitHub Raw -->
  <audio id="revealSong" src="https://raw.githubusercontent.com/abhipabhi472-ctrl/Tplay/main/animal-ney-veyrey-songcouplestelugu-efx-whatsapp-statuslove-song-statussrkedits297207511.mp3" loop preload="auto"></audio>

  <div class="phone-card" id="appCard"></div>

  <script>
    const PRIYA_PHOTO_URL = "https://i.postimg.cc/JhzGFHgf/IMG-20261119-210055.jpg";

    const state = {
      step: 0,
      when: "Tomorrow",
      time: "Evening",
      where: "Chat & Call",
      bring: "A sweet note",
      then: "More talking"
    };

    const dodgeLabels = [
      "No",
      "Are you sure?",
      "Really?",
      "Puppy is crying!",
      "Try the pink one!"
    ];
    let dodgeCount = 0;

    // Soft Low Love BGM via Web Audio API
    let audioCtx = null;
    let bgmGain = null;
    let bgmTimer = null;
    let bgmActive = false;

    const softChords = [
      [261.63, 329.63, 392.00],
      [220.00, 261.63, 329.63],
      [174.61, 220.00, 261.63],
      [196.00, 246.94, 293.66]
    ];
    let chordIdx = 0;

    function playSoftChord(notes) {
      if (!audioCtx || !bgmGain || !bgmActive) return;
      const now = audioCtx.currentTime;
      notes.forEach((freq) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = "sine";
        osc.frequency.setValueAtTime(freq, now);
        gain.gain.setValueAtTime(0.0001, now);
        gain.gain.exponentialRampToValueAtTime(0.022, now + 0.5);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + 2.5);
        osc.connect(gain);
        gain.connect(bgmGain);
        osc.start(now);
        osc.stop(now + 2.6);
      });
    }

    function startLowLoveBgm() {
      if (bgmActive) return;
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      if (!AudioCtx) return;

      if (!audioCtx) {
        audioCtx = new AudioCtx();
        bgmGain = audioCtx.createGain();
        bgmGain.gain.setValueAtTime(0.14, audioCtx.currentTime);
        bgmGain.connect(audioCtx.destination);
      }
      if (audioCtx.state === "suspended") {
        audioCtx.resume();
      }
      bgmActive = true;
      playSoftChord(softChords[chordIdx]);
      chordIdx = (chordIdx + 1) % softChords.length;

      bgmTimer = setInterval(() => {
        playSoftChord(softChords[chordIdx]);
        chordIdx = (chordIdx + 1) % softChords.length;
      }, 2500);
    }

    function stopLowLoveBgm() {
      bgmActive = false;
      if (bgmTimer) {
        clearInterval(bgmTimer);
        bgmTimer = null;
      }
      if (audioCtx && bgmGain) {
        bgmGain.gain.setTargetAtTime(0.0001, audioCtx.currentTime, 0.1);
      }
    }

    const appCard = document.getElementById("appCard");
    const revealSong = document.getElementById("revealSong");

    function playRevealSong() {
      stopLowLoveBgm();
      revealSong.currentTime = 0;
      revealSong.play().then(() => {
        const btn = document.getElementById("songToggleBtn");
        if (btn) btn.textContent = "🔊 Song Playing • Tap to Pause";
      }).catch(() => {
        const btn = document.getElementById("songToggleBtn");
        if (btn) btn.textContent = "🔊 Tap to Play Song";
      });
    }

    function launchConfetti() {
      const colors = ["#ff4d8d", "#ff9ec4", "#ffd166", "#ffffff", "#d8b4fe"];
      for (let i = 0; i < 42; i++) {
        const dot = document.createElement("div");
        dot.className = "confetti-piece";
        dot.style.left = Math.random() * 100 + "vw";
        dot.style.background = colors[Math.floor(Math.random() * colors.length)];
        dot.style.animationDuration = (2.4 + Math.random() * 2.4) + "s";
        dot.style.animationDelay = (Math.random() * 0.5) + "s";
        document.body.appendChild(dot);
        setTimeout(() => dot.remove(), 5000);
      }
    }

    function moveDodgeButton(btn) {
      const dx = Math.floor(Math.random() * 130) - 65;
      const dy = Math.floor(Math.random() * 64) - 32;
      btn.style.transform = `translate(${dx}px, ${dy}px)`;
      dodgeCount++;
      btn.textContent = dodgeLabels[Math.min(dodgeCount, dodgeLabels.length - 1)];

      const popup = document.getElementById("puppyPopup");
      if (popup) popup.style.display = "block";
    }

    function renderStep() {
      const totalSteps = 5;
      const pct = ((state.step + 1) / totalSteps) * 100;

      if (state.step === 0) {
        appCard.innerHTML = `
          <div class="step-pill">Step 1 of 5 • For Priya</div>
          <div class="progress-track"><div class="progress-bar" style="width:${pct}%"></div></div>
          <h1 class="script-title">Hey Priya</h1>
          <p class="sub-prompt">If you could tell me how you feel without saying those three words, what would you pick?</p>
          <div class="arena">
            <button class="btn-yes" id="q1Right">My favorite person 💕</button>
            <button class="btn-dodge" id="q1Wrong">Just a random contact</button>
          </div>
          <div class="puppy-popup" id="puppyPopup">
            <div class="puppy-face">🐶😢💧</div>
            <div class="puppy-msg">A little puppy is crying because you picked the wrong one! Tap "My favorite person 💕".</div>
          </div>
          <div class="bgm-note" id="bgmBtn">🎵 Tap anywhere for soft love BGM</div>
        `;

        document.getElementById("q1Right").addEventListener("click", () => {
          startLowLoveBgm();
          dodgeCount = 0;
          state.step = 1;
          renderStep();
        });

        document.getElementById("q1Wrong").addEventListener("click", (e) => {
          e.stopPropagation();
          startLowLoveBgm();
          moveDodgeButton(e.currentTarget);
        });
      } else if (state.step === 1) {
        appCard.innerHTML = `
          <div class="step-pill">Step 2 of 5 • Date Invite</div>
          <div class="progress-track"><div class="progress-bar" style="width:${pct}%"></div></div>
          <h1 class="script-title">Will you go out with me, Priya?</h1>
          <p class="sub-prompt">No pressure... just a sweet little plan made for you.</p>
          <div class="arena">
            <button class="btn-yes" id="yesDateBtn">Yes! 💖</button>
            <button class="btn-dodge" id="noDateBtn">No</button>
          </div>
          <div class="puppy-popup" id="puppyPopup">
            <div class="puppy-face">🐶😢💧</div>
            <div class="puppy-msg">Puppy is sad you said no! Tap "Yes! 💖" to cheer it up.</div>
          </div>
          <div class="bgm-note" id="bgmBtn">🎵 Soft love BGM playing softly</div>
        `;

        document.getElementById("yesDateBtn").addEventListener("click", () => {
          startLowLoveBgm();
          dodgeCount = 0;
          state.step = 2;
          renderStep();
        });

        document.getElementById("noDateBtn").addEventListener("click", (e) => {
          e.stopPropagation();
          startLowLoveBgm();
          moveDodgeButton(e.currentTarget);
        });
      } else if (state.step === 2) {
        const days = ["Today", "Tomorrow", "This Weekend", "Whenever you're free"];
        const times = ["Morning", "Afternoon", "Evening", "Late Night"];
        appCard.innerHTML = `
          <div class="step-pill">Step 3 of 5 • When</div>
          <div class="progress-track"><div class="progress-bar" style="width:${pct}%"></div></div>
          <h1 class="script-title">When are you free?</h1>
          <p class="sub-prompt">Pick a day and time that feels right for you.</p>
          <div class="choice-grid">
            ${days.map(d => `
              <button class="choice-btn ${state.when === d ? "selected" : ""}" data-when="${d}">
                <span class="choice-title">${d}</span>
                <span class="choice-desc">Easy & cozy</span>
              </button>
            `).join("")}
          </div>
          <div class="time-row">
            ${times.map(t => `
              <button class="time-chip ${state.time === t ? "selected" : ""}" data-time="${t}">${t}</button>
            `).join("")}
          </div>
          <button class="btn-yes" style="width:100%" id="nextFromWhen">Continue →</button>
          <div class="bgm-note" id="bgmBtn">🎵 Soft love BGM playing softly</div>
        `;

        appCard.querySelectorAll("[data-when]").forEach(btn => {
          btn.addEventListener("click", () => {
            startLowLoveBgm();
            state.when = btn.dataset.when;
            renderStep();
          });
        });
        appCard.querySelectorAll("[data-time]").forEach(btn => {
          btn.addEventListener("click", () => {
            startLowLoveBgm();
            state.time = btn.dataset.time;
            renderStep();
          });
        });
        document.getElementById("nextFromWhen").addEventListener("click", () => {
          startLowLoveBgm();
          state.step = 3;
          renderStep();
        });
      } else if (state.step === 3) {
        const places = [
          { title: "Chat & Call", desc: "Long talks & laughs" },
          { title: "Coffee Spot", desc: "Warm cups & stories" },
          { title: "Quiet Walk", desc: "Slow evening stroll" },
          { title: "Movie & Snacks", desc: "Easy & relaxed" }
        ];
        const brings = [
          { title: "A sweet note", desc: "Straight from the heart" },
          { title: "Your fav song", desc: "Queueing it up" },
          { title: "Something sweet", desc: "Little treat" },
          { title: "Just my time", desc: "All yours" }
        ];

        appCard.innerHTML = `
          <div class="step-pill">Step 4 of 5 • Vibe & Details</div>
          <div class="progress-track"><div class="progress-bar" style="width:${pct}%"></div></div>
          <h1 class="script-title">Where & what to bring?</h1>
          <p class="sub-prompt">Choose your vibe and little extra.</p>
          <div class="choice-grid">
            ${places.map(p => `
              <button class="choice-btn ${state.where === p.title ? "selected" : ""}" data-where="${p.title}">
                <span class="choice-title">${p.title}</span>
                <span class="choice-desc">${p.desc}</span>
              </button>
            `).join("")}
          </div>
          <div class="choice-grid">
            ${brings.map(b => `
              <button class="choice-btn ${state.bring === b.title ? "selected" : ""}" data-bring="${b.title}">
                <span class="choice-title">${b.title}</span>
                <span class="choice-desc">${b.desc}</span>
              </button>
            `).join("")}
          </div>
          <button class="btn-yes" style="width:100%" id="nextFromWhere">Continue →</button>
          <div class="bgm-note" id="bgmBtn">🎵 Soft love BGM playing softly</div>
        `;

        appCard.querySelectorAll("[data-where]").forEach(btn => {
          btn.addEventListener("click", () => {
            startLowLoveBgm();
            state.where = btn.dataset.where;
            renderStep();
          });
        });
        appCard.querySelectorAll("[data-bring]").forEach(btn => {
          btn.addEventListener("click", () => {
            startLowLoveBgm();
            state.bring = btn.dataset.bring;
            renderStep();
          });
        });
        document.getElementById("nextFromWhere").addEventListener("click", () => {
          startLowLove
